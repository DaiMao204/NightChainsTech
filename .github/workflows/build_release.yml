name: Build & Release NightChainsTech

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Package
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PDM
        uses: pdm-project/setup-pdm@v4
        with:
          python-version: "3.12"
          cache: true

      - name: Install dependencies
        run: pdm install

      - name: Set version
        shell: pwsh
        run: |
          Set-Content -Path version.py -Value "__version__ = '${{ github.ref_name }}'" -Encoding UTF8

      - name: Build updater
        shell: pwsh
        run: |
          pdm run pyinstaller `
            -F `
            --distpath .\dist\updater `
            -i resources\app\icons\logo.ico `
            -n NightChainsTechUpdater `
            tools\apply_update.py `
            -y `
            -w

      - name: Build application
        shell: pwsh
        run: |
          $venvPath = pdm venv --path in-project
          $sitePackages = Join-Path $venvPath "Lib\site-packages"
          pdm run pyinstaller `
            -D `
            --distpath .\dist `
            -i resources\app\icons\logo.ico `
            -n "黑月科技" `
            gui.py `
            -y `
            -w `
            --add-data "$sitePackages\onnxocr\models\ppocrv4;onnxocr\models\ppocrv4"

      - name: Assemble package
        shell: pwsh
        run: |
          $packageName = "NightChainsTech_${{ github.ref_name }}"
          $packageRoot = ".\dist\$packageName"
          New-Item -ItemType Directory -Path $packageRoot -Force | Out-Null
          Copy-Item -Path ".\dist\黑月科技\*" -Destination $packageRoot -Recurse -Force
          Copy-Item -Path ".\dist\updater\NightChainsTechUpdater.exe" -Destination $packageRoot -Force
          Copy-Item -Path ".\resources" -Destination "$packageRoot\resources" -Recurse -Force
          Copy-Item -Path ".\README.md" -Destination $packageRoot -Force
          Copy-Item -Path ".\LICENSE" -Destination $packageRoot -Force
          Copy-Item -Path ".\docs" -Destination "$packageRoot\docs" -Recurse -Force
          7z a -tzip -mx=9 ".\dist\$packageName.zip" $packageRoot
          $hash = (Get-FileHash ".\dist\$packageName.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path ".\dist\SHA256.txt" -Value "SHA256: $hash" -Encoding UTF8
          @(
            "# 黑月科技 ${{ github.ref_name }}"
            ""
            "测试版发布包：NightChainsTech_${{ github.ref_name }}.zip"
            ""
            "``````text"
            "SHA256: $hash"
            "``````"
            ""
            "> 当前版本仍处于 beta 测试阶段，请保留旧版本备份。"
          ) | Set-Content -Path ".\dist\release_notes.md" -Encoding UTF8

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: NightChainsTech_${{ github.ref_name }}.zip
          path: .\dist\NightChainsTech_${{ github.ref_name }}.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: 黑月科技 ${{ github.ref_name }}
          body_path: .\dist\release_notes.md
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') || contains(github.ref_name, 'alpha') }}
          files: |
            ./dist/NightChainsTech_${{ github.ref_name }}.zip
            ./dist/SHA256.txt
